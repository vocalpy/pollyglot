[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pollyglot"
authors = [{name = "David Nicholson", email = "nickledave@users.noreply.github.com"}]
description = "Python library for working with bioacoustics and animal acoustic communication datasets"
version = "0.1"
readme = "README.md"
dependencies = [
    "crowsetta >= 5.1.3",
    "vocalpy >= 0.11.0",
]


[project.urls]
Home = "https://github.com/vocalpy/pollyglot"


[tool.flit.module]
name = "glot"
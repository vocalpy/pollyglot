[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pollyglot"
authors = [{name = "David Nicholson", email = "nickledave@users.noreply.github.com"}]
description = "Python library for working with bioacoustics and animal acoustic communication datasets"
version = "0.1"
readme = "README.md"
classifiers = [
        'License :: OSI Approved :: BSD License',
        'Development Status :: 5 - Production/Stable',
        'Programming Language :: Python',
        'Programming Language :: Python :: 3',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Programming Language :: Python :: Implementation :: CPython'
]
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "crowsetta >= 5.1.3",
    "vocalpy >= 0.11.0",
]

[project.urls]
Home = "https://github.com/vocalpy/pollyglot"


[dependency-groups]
test = [
    "pytest >=6.2.5",
    "pytest-cov >=2.12.0",
    "pytest-xdist >=3.2.0",
]
doc = [
    "ipython >= 8.20.0",
    "jupyterlab >=3.0.3",
    "jupytext >=1.13.8",
    "myst-nb >=0.15.0",
    "numpydoc >=1.6.0",
    "Sphinx >=3.4.3",
    "sphinx-autobuild >= 2021.3.14",
    "sphinx-book-theme >=0.3.2",
    "sphinx-copybutton >=0.4.0",
    "sphinx-design >=0.2.0",
    "sphinxext-opengraph  >=0.5.1",
    "sphinx-tabs >= 3.3.1",
]
lint = [
    "black >=21.12b0",
    'flake8 >=6.0.0',
    'isort >=5.12.0',
    'pycln >=2.1.3',
]
dev = [
    "twine >=3.7.1",
    "ipython >= 8.20.0",
    "nox >= 2022.1.7",
    "tqdm >= 4.67.3",
    {include-group = "doc"},
    {include-group = "test"},
    {include-group = "lint"},
]


[tool.flit.module]
name = "glot"